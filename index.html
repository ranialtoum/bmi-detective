<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BMI Detective: Beyond the Number</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>/*
VOICE: a serious science investigation for 15-year-olds: calm, precise, a little cinematic; never cartoonish.
IDEA: a forensic case file and evidence board: profiles as index cards, steps as a lab notebook, the teacher view as an incident room.
PICTURE: a magnifier over two identical 22.7 readings with different routine icons; the working missions are themselves the picture.
COLOUR and TYPE: Qatar maroon leads, clinical teal supports, one saffron accent; white paper by day, deep ink by night. Archivo / Source Sans 3 / Noto Naskh Arabic.
LAYOUT: sticky header with lesson-timer ring; content ≤1240px; two-column work + side notebook that stacks under 900px.
*/
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#121417);--paper:light-dark(#f5f3f1,#1b1e22);--card:light-dark(#ffffff,#202429);
--ink:light-dark(#1d1a1c,#ecebea);--muted:light-dark(#5d5a5c,#a9a7a6);--line:light-dark(#e3dedb,#33383e);
--maroon:light-dark(#7a1f3d,#e07c9b);--maroon-bg:light-dark(#f7e9ee,#3a1a25);--teal:light-dark(#1d6f72,#6cc4c3);--teal-bg:light-dark(#e3f2f1,#15302f);
--sun:#e8a317;--ok:light-dark(#18744a,#66d19e);--ok-bg:light-dark(#e6f4ec,#173226);--warn:light-dark(#8a4b00,#f2c06b);--warn-bg:light-dark(#fff3dc,#3a2c12);
--r:12px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.55 "Source Sans 3",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,h4{font-family:Archivo,system-ui,sans-serif;line-height:1.1;margin:0 0 .5em;text-wrap:balance}
h1{font-size:clamp(28px,4vw,44px);font-weight:800}h2{font-size:22px;font-weight:800}h3{font-size:17px;font-weight:700}h4{font-size:15px}
p{margin:.3em 0 .7em}a{color:var(--teal)}
[dir=rtl],.ar{font-family:"Noto Naskh Arabic","Source Sans 3",serif}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.page{max-width:1240px;margin:0 auto;padding:20px max(4vw,14px) 60px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tiny{font-size:13px;color:var(--muted)}.muted{color:var(--muted)}.lead{font-size:18px}
.kicker{font-size:14px;color:var(--maroon);font-weight:600;margin:0 0 6px}
.row{display:flex;gap:8px;align-items:center}.row.wrap,.wrap.row{flex-wrap:wrap}.grow{flex:1}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.four{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.scroll{overflow-x:auto}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px max(4vw,14px);background:var(--maroon);color:#fff}
.top .btn.ghost{color:#fff;border-color:#ffffff66}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;color:#fff;font:800 19px Archivo,sans-serif;cursor:pointer;min-height:44px;padding:0}
.brand svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:2.4}.brand text{fill:#fff;stroke:none;font:700 8px Archivo,sans-serif}
.who{font-size:14px;opacity:.9;margin-right:auto}
.htimer{display:flex;align-items:center;gap:8px;background:#ffffff1f;border-radius:999px;padding:4px 12px 4px 4px}
.ring{width:36px;height:36px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:4}.ring-bg{stroke:#ffffff40}.ring-fg{stroke:var(--sun);stroke-linecap:round;transition:stroke-dasharray .6s}
.ht-txt{display:grid;line-height:1.1}.ht-txt b{font-size:17px}.ht-txt span{font-size:12px;opacity:.9}
.demo-tag{background:var(--sun);color:#2a1b00;font:700 11.5px/1 "Source Sans 3",sans-serif;padding:4px 7px;border-radius:5px;white-space:nowrap}

/* controls */
.btn{min-height:44px;padding:9px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 15.5px "Source Sans 3",sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--teal)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme=dark] .btn.primary{color:#062021}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.primary{color:#062021}}
.btn.ghost{background:transparent}.btn.danger{border-color:#b3261e;color:#b3261e}.btn.small{min-height:38px;padding:6px 12px;font-size:14.5px}.btn.big{font-size:18px;padding:12px 22px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input,textarea,select{font:16px "Source Sans 3",sans-serif;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;min-height:44px;width:100%}
textarea{resize:vertical;line-height:1.45}input:disabled,textarea:disabled,select:disabled{background:var(--paper);color:var(--muted)}
.row input{width:auto;flex:1}.row select{width:auto}
input[type=range]{padding:0;border:0;accent-color:var(--teal)}input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:0;accent-color:var(--teal);margin:0}
.field{display:grid;gap:4px;margin:10px 0}.flabel{font-weight:600;font-size:15.5px}.fhint{font-size:13.5px;color:var(--muted)}
.mini-in{display:grid;gap:3px;font-size:14px;font-weight:600}.mini-in input,.mini-in select{width:150px}
.check{display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:15px}.check input{margin-top:3px}
.unit{font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{min-height:40px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:15px "Source Sans 3",sans-serif;cursor:pointer}
.chip.on{background:var(--teal-bg);border-color:var(--teal);color:var(--teal);font-weight:600}
.tiny-chip{min-height:32px;padding:3px 10px;font-size:13.5px}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--maroon-bg);color:var(--maroon);font-size:13px;font-weight:600}
.badges{display:flex;gap:5px;flex-wrap:wrap}
.note{background:var(--teal-bg);border-radius:10px;padding:10px 14px;margin:10px 0}.note.warn{background:var(--warn-bg);color:var(--warn)}
.fb{border-radius:9px;padding:8px 12px;margin:6px 0;font-size:15px}.fb.ok{background:var(--ok-bg);color:var(--ok)}.fb.try{background:var(--warn-bg);color:var(--warn)}
.exp{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}.exp-msg{font-size:13.5px;color:var(--teal)}
.confirm{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px}
.empty{color:var(--muted);padding:18px;border:1.5px dashed var(--line);border-radius:10px;text-align:center}.empty.small{padding:10px}

/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:14px 0}
.panel h3{margin-top:12px}.panel h3:first-child{margin-top:0}
.tabs,.ttabs,.snav{display:flex;gap:4px;margin:6px 0 10px;flex-wrap:nowrap}
.tab{flex:none;min-height:44px;padding:8px 14px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font:600 15px "Source Sans 3",sans-serif;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--maroon);border-bottom-color:var(--maroon)}

/* home */
.home-hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center;background:var(--maroon-bg);border-radius:20px;padding:clamp(20px,4vw,44px)}
.home h1{font-size:clamp(36px,6vw,56px);color:var(--maroon);margin:0 0 10px}.home h1 span{display:block;font-size:.5em;color:var(--teal);margin-top:6px}
.q-big{font:700 clamp(20px,2.4vw,26px)/1.25 Archivo,sans-serif;margin:8px 0}
.task{font-size:16px;color:var(--muted);max-width:62ch}
.hero-art{width:100%;max-width:420px;justify-self:center}
.art-board{fill:var(--card);stroke:var(--line)}.art-dot{fill:var(--maroon);opacity:.18}
.art-card{fill:var(--paper);stroke:var(--line);stroke-width:1.5}.art-n{font:800 30px Archivo,sans-serif;fill:var(--maroon);text-anchor:middle}
.art-u{font:600 11px "Source Sans 3",sans-serif;fill:var(--muted);text-anchor:middle}.art-ic *{fill:none;stroke:var(--teal);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.art-rim{fill:none;stroke:var(--teal);stroke-width:6}.art-handle{stroke:var(--teal);stroke-width:12;stroke-linecap:round}
.art-q{font:600 13px "Source Sans 3",sans-serif;fill:var(--muted);text-anchor:middle}
@media (prefers-reduced-motion:no-preference){.art-lens{animation:scan 7s ease-in-out infinite}@keyframes scan{0%,100%{transform:translate(0,0)}50%{transform:translate(-128px,-14px)}}}
.enter{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.letters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.letter{display:grid;justify-items:center;gap:2px;padding:14px 6px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;font-family:inherit}
.letter b{font:800 34px Archivo,sans-serif;color:var(--maroon)}.letter span{font-size:13.5px;text-align:center}.letter small{color:var(--muted)}
.letter:hover{border-color:var(--maroon)}

/* hub */
.hub-hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:stretch;margin-top:8px}
.hub-score{background:var(--teal-bg);border-radius:16px;padding:18px}.score-n{font:800 clamp(40px,6vw,60px)/1 Archivo,sans-serif;color:var(--teal)}.score-l{font-weight:600}
.missions{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px;margin:18px 0}
.mcard{width:100%;text-align:left;display:grid;gap:3px;padding:16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit;position:relative;min-height:126px}
.mcard:hover{border-color:var(--maroon)}.mcard.done{background:var(--ok-bg);border-color:var(--ok)}
.mnum{font:800 28px/1 Archivo,sans-serif;color:var(--maroon)}.mtitle{font:700 17px Archivo,sans-serif}.mstage{font-size:13.5px;color:var(--muted)}.mstatus{font-size:14px;font-weight:600;color:var(--teal)}
.send .code,.code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;word-break:break-all;margin-top:8px}

/* missions */
.mhead{margin:10px 0 6px}.formula-chip{display:inline-block;background:var(--maroon);color:#fff;padding:8px 16px;border-radius:10px;font:700 18px Archivo,sans-serif;margin:4px 0}
.profile{background:var(--paper);border-radius:12px;padding:14px;border:1px solid var(--line)}
.pf-head{display:flex;gap:10px;align-items:center}.avatar{width:42px;height:42px;flex:none}.pf-name{font:700 18px Archivo,sans-serif}.pf-meta{font-size:14px;color:var(--muted)}
.pf-data{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 6px}.pf-data div{display:grid}.pf-data dt{font-size:12.5px;color:var(--muted)}.pf-data dd{margin:0;font:700 17px Archivo,sans-serif;white-space:nowrap}
.pf-routine{margin:6px 0 0;padding-left:18px;font-size:15px}.pf-ctx{font-size:15px;margin:6px 0 0}
.q{color:var(--maroon)}
.choices{border:0;padding:0;margin:6px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px}
.choice{display:flex;gap:10px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-weight:600}.choice.on{border-color:var(--teal);background:var(--teal-bg)}
.m2grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.side .panel{margin-top:0}.qlist{padding-left:18px;margin:4px 0}.qlist li{margin:4px 0}.qlist.big li{font-size:18px;margin:8px 0}
.case-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.steps{padding-left:24px;margin:14px 0 0}.steps>li{padding:10px 0;border-bottom:1px solid var(--line)}.steps>li::marker{font:800 17px Archivo,sans-serif;color:var(--maroon)}
.step-t{display:block;font-weight:600;margin-bottom:6px}
.steps .row input{max-width:200px}
.calc-in{display:grid;gap:8px}.calc-in label{display:grid;gap:3px;font-size:14px;font-weight:600}
.calc-steps{background:var(--paper);border-radius:10px;padding:10px 12px;margin:10px 0 4px;display:grid;gap:4px}
.calc-steps div{display:flex;justify-content:space-between;gap:8px;font-size:14.5px}.calc-steps b{white-space:nowrap;font-variant-numeric:tabular-nums}
.calc-res{border-top:1px solid var(--line);padding-top:6px}.calc-res b{font:800 24px Archivo,sans-serif;color:var(--teal)}.calc-res small{font-size:13px}
.reverse{background:var(--teal-bg);border-radius:10px;padding:10px 12px;margin-top:8px;display:grid;gap:6px}.reverse input{max-width:120px}
.claim-quote{margin:10px 0;padding:14px 18px;border-left:5px solid var(--maroon);background:var(--maroon-bg);font:600 18px/1.4 "Source Sans 3",sans-serif;border-radius:0 10px 10px 0}
.stepH{display:flex;align-items:center;gap:10px;margin-top:22px!important;padding-top:14px;border-top:2px solid var(--line)}
.stepH span{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--maroon);color:#fff;font-size:15px;flex:none}
.cer .field:nth-child(1) .flabel{color:var(--maroon)}.cer .field:nth-child(2) .flabel{color:var(--teal)}.cer .field:nth-child(3) .flabel{color:var(--warn)}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}.compare>div{background:var(--paper);border-radius:10px;padding:12px}
.mini{margin:0;display:grid;gap:6px}.mini dt{font-size:12.5px;color:var(--muted);font-weight:600}.mini dd{margin:0;font-size:15px}
.designer{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.preview-col .sticky{position:sticky;top:76px}
.checklist{list-style:none;padding:0;margin:0 0 10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:4px 10px;font-size:14px}
.checklist li{color:var(--muted)}.checklist li.ok{color:var(--ok);font-weight:600}
.fbcard{background:var(--paper);border-radius:10px;padding:10px 12px;margin:8px 0}
.opt summary{cursor:pointer;font-weight:600;padding:8px 0;min-height:44px}
.mfoot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin:18px 0}

/* teacher */
.timer-big{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.timer-big div{display:grid}.timer-big b{font:800 22px Archivo,sans-serif}
.phasebar{display:flex;gap:3px;margin:12px 0}.pb{position:relative;height:30px;background:var(--paper);border-radius:6px;overflow:hidden}
.pb i{position:absolute;inset:0 auto 0 0;background:var(--teal-bg)}.pb.cur{outline:2px solid var(--maroon)}.pb span{position:relative;display:grid;place-items:center;height:100%;font-weight:700;font-size:13px}
.guide-now{background:var(--maroon-bg);border-radius:10px;padding:10px 14px;margin-top:10px}
.pred{background:var(--paper);border-radius:10px;padding:12px}
table{border-collapse:collapse;width:100%;font-size:14.5px}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:13px;color:var(--muted);font-weight:600}
.name-in{min-width:130px;min-height:38px;padding:5px 8px}
.filters{margin:6px 0 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}.cards.narrow{grid-template-columns:1fr}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 8px}
.rcard.sel{border:2px solid var(--maroon)}
.rcard header{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.rtext{white-space:pre-wrap;font:15px/1.45 "Source Sans 3",sans-serif;margin:0 0 8px;background:var(--paper);padding:8px 10px;border-radius:8px}.rtext.short{max-height:9em;overflow:auto}
.tagrow{gap:5px}.note-in{margin-top:6px;min-height:38px}.sugg{color:var(--warn)}
.cat{border-top:5px solid var(--line)}.cat1{border-top-color:#c2410c}.cat2{border-top-color:var(--maroon)}.cat3{border-top-color:var(--sun)}.cat4{border-top-color:var(--ok)}.catU{border-top-color:var(--teal)}
.catgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px}
.count{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--maroon);color:#fff;font-size:13px}
.evroom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.cards.pick{max-height:72vh;overflow:auto;padding-right:4px;margin-top:10px}.evroom>div:first-child .mini-in{display:inline-grid;margin-right:10px}
.seq{padding:0;list-style:none}.seq li{background:var(--maroon-bg);border-radius:12px;padding:12px;margin-bottom:10px}.seq-h{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.present{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto auto;padding:16px max(4vw,16px);overflow:auto}
.present-top{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-weight:600}
.present-body{max-width:1000px;width:100%;margin:10px auto}.present-body h1{color:var(--maroon)}
.present-text{white-space:pre-wrap;font:clamp(19px,2.2vw,26px)/1.45 "Source Sans 3",sans-serif;background:var(--paper);padding:20px 24px;border-radius:14px;margin:0}
.present-q{max-width:1000px;width:100%;margin:8px auto;background:var(--teal-bg);border-radius:12px;padding:12px 16px;display:grid;gap:6px}.present-q b{font:700 clamp(18px,2vw,22px) Archivo,sans-serif}
.present-nav{display:flex;justify-content:center;gap:10px;padding:8px}
.exports{display:grid;gap:10px;margin-bottom:12px}.exports>div{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tgrid .panel:first-child{margin-top:4px}
.kitnav{display:flex;gap:16px;padding:8px 0;position:sticky;top:60px;background:var(--bg);z-index:5}.kitnav a{flex:none;font-weight:600}
.kit ol.big li,.kit ul li{margin:5px 0}.guide-phase{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
html{scroll-padding-top:120px}
.foot{text-align:center;font-size:13px;color:var(--muted);padding:20px;border-top:1px solid var(--line)}

@media (max-width:900px){.m2grid,.designer,.evroom,.catgrid,.hub-hero,.home-hero{grid-template-columns:1fr}.preview-col .sticky{position:static}.case-top{grid-template-columns:1fr}.hero-art{max-width:300px}}
@media (max-width:600px){.letters{grid-template-columns:repeat(2,minmax(0,1fr))}.who{display:none}.panel{padding:14px}table{font-size:13px}
.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;font-weight:600;color:var(--muted);white-space:normal}.stack td:empty{display:none}}
@media print{.preview-col .row,.top,.foot,.snav,.mfoot,.send,.editor,.checklist,.panel:not(.keep){display:none!important}.preview-col .sticky{position:static}.designer{display:block}}
